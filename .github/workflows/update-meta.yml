# 매일 새벽(한국 시간 05:00) 메타 덱을 자동으로 받아 data/ 파일을 갱신합니다.
# Actions 탭에서 "Run workflow"를 누르면 바로 실행할 수도 있습니다.
name: 메타 덱 자동 업데이트

on:
  schedule:
    - cron: '0 20 * * *'   # UTC 20:00 = KST 05:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-meta
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 업데이트 프로그램 빌드
        run: |
          cp index.html updater/index.html
          cd updater && go build -o ../tftdeck . && cd ..

      - name: 메타 덱 받기 (tftactics → MetaTFT → tftlabs, 실패한 출처는 기존 파일 유지)
        env:
          TFT_BROWSER: /usr/bin/google-chrome
        run: |
          ./tftdeck -update all -data data || echo "::warning::일부 출처 업데이트 실패 — data/debug 폴더와 로그 확인"
          echo "---- 로그 ----"; tail -n 30 data/tftdeck.log || true
          ls -la data/debug || true

      - name: 변경 사항 커밋
        run: |
          git config user.name "meta-updater"
          git config user.email "actions@users.noreply.github.com"
          git add data/meta.txt data/meta_metatft.txt data/meta_tftlabs.txt
          git add -A data/debug 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "메타 덱 자동 업데이트 $(date -u +'%Y-%m-%d')"
            git push
          fi
